name: Windows package

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'Release1.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    outputs:
      package_version: ${{ steps.version.outputs.version }}
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Choose package version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME
          } else {
            git fetch --tags --force
            $numbers = @(git tag -l 'Release1.*' | ForEach-Object {
              if ($_ -match '^Release1\.(\d+)$') { [int]$Matches[1] }
            })
            $next = if ($numbers.Count -gt 0) { (($numbers | Measure-Object -Maximum).Maximum + 1) } else { 1 }
            $version = "Release1.$next"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify and package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./Package.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: PoteHunter-package-diagnostics-${{ github.run_id }}
          path: |
            PoteHunter/bin/Release/net10.0-windows/self-test.txt
            PoteHunter/bin/Release/net10.0-windows/*checks.json
            PoteHunter/bin/Release/net10.0-windows/ranged-ui-check.json
            PoteHunter/bin/Release/net10.0-windows/ui-page-0.png
            PoteHunter/bin/Release/net10.0-windows/radar-preview.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Build and test installer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./Installer.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: PoteHunter-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/${{ steps.version.outputs.version }}/*
          if-no-files-found: error

  release:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out history for patch notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download packaged files
        uses: actions/download-artifact@v7
        with:
          name: PoteHunter-${{ needs.package.outputs.package_version }}-win-x64
          path: release-assets

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.package_version }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $previousTag = git tag --sort=-creatordate | Where-Object { $_ -and $_ -ne $env:RELEASE_TAG } | Select-Object -First 1
          if ($previousTag) {
            $changeLines = @(git log --pretty=format:'- `%h` %s' "$previousTag..HEAD" -n 30)
          } else {
            $changeLines = @(git log --pretty=format:'- `%h` %s' -n 30 HEAD)
          }
          if ($changeLines.Count -eq 0) { $changeLines = @('- Packaging and validation updates.') }
          $versionNotes = @()
          $capturingNotes = $false
          foreach ($line in (Get-Content -LiteralPath 'RELEASE-NOTES.md')) {
            if ($line.StartsWith('## ')) {
              if ($capturingNotes) { break }
              $capturingNotes = $line -eq "## $env:RELEASE_TAG"
              continue
            }
            if ($capturingNotes) { $versionNotes += $line }
          }
          $releaseTitle = $env:RELEASE_TAG
          @(
            "$releaseTitle for Windows x64."
            ''
            '## Patch notes'
            $versionNotes
            ''
            '## Source changes'
            "Changes since $($previousTag ?? 'the initial release'):"
            $changeLines
            ''
            '## Included features'
            'Download the installer or portable ZIP with its SHA256 sidecar. For the ZIP, extract the complete PoteHunter folder and run PoteHunter.exe.'
            ''
            'Includes the PlayPoteBot Orbital Ops interface, saved routes, recovery setup, loot tracking, public updater, combined group healer mode and HP/MP recovery. See the version patch notes for changes and validation limits.'
          ) | Set-Content -LiteralPath $notesPath -Encoding utf8

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--title', $releaseTitle,
            '--notes-file', $notesPath
          )
          $arguments += (Get-ChildItem -LiteralPath 'release-assets' -File | Where-Object { $_.Name -match '\.(zip|exe|sha256)$' } | ForEach-Object { $_.FullName })
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Release publishing failed with exit code $LASTEXITCODE." }

      - name: Mirror public update downloads
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: pwsh
        env:
          PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.package.outputs.package_version }}
        run: ./Publish-PublicRelease.ps1 -Version $env:RELEASE_TAG
